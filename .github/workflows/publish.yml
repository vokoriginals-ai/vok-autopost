name: Publish posts

on:
  # Manual: Actions → "Publish posts" → Run workflow
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post folder name to publish now (leave empty = publish all approved posts that are due)"
        required: false
        default: ""
  # Automatic: once an hour (at :07), publish approved posts whose time has come.
  # Hourly keeps us well inside GitHub's free monthly minutes for private repos.
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anything to publish?
        id: check
        run: |
          if [ -n "${{ github.event.inputs.post_id }}" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=5)))
          due = False
          for p in glob.glob("posts/*/post.json"):
              m = json.load(open(p, encoding="utf-8"))
              t = m.get("publish_at")
              if m.get("status") == "approved" and (not t or datetime.fromisoformat(t) <= now):
                  due = True
          print("go=" + ("yes" if due else "no"))
          EOF
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.go == 'yes'
        run: pip install -r requirements.txt

      - name: Publish
        if: steps.check.outputs.go == 'yes'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.post_id }}" ]; then
            python -m vok.run publish "${{ github.event.inputs.post_id }}"
          else
            python -m vok.run due
          fi

      - name: Save status back to the repo
        if: always() && steps.check.outputs.go == 'yes'
        run: |
          git config user.name "vok-bot"
          git config user.email "vok-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Update post status [skip ci]"
          git push
