name: Approve & publish

# Every 30 min from 09:07 to 23:37 Pakistan time:
#   read your ok/no email replies → publish the next approved post (one per run).
# Image libraries are cached, so each run still takes well under a minute.
on:
  schedule:
    - cron: "7,22,37,52 7-23 * * *"   # PKT 12:07 pm to 4:52 am
    - cron: "7,22,37,52 0-4 * * *"    # PKT 5:07 am to 9:52 am
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publish this post folder right now (optional)"
        required: false
        default: ""
      drip:
        description: "Stay on and spread queued posts until 10 am (yes/no)"
        required: false
        default: "no"
      publish_all_approved:
        description: "Publish ALL approved posts now, 3 min apart (yes/no)"
        required: false
        default: "no"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ${{ github.event.inputs.drip == 'yes' && 'vok-drip' || 'vok-repo' }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (only for posts where you attached a photo)
        run: pip install -q -r requirements.txt

      - name: Approvals + publish
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          ALL: ${{ github.event.inputs.publish_all_approved }}
          PYTHONUNBUFFERED: "1"
          DRIP: ${{ github.event.inputs.drip }}
        run: |
          git config user.name "vok-bot"
          git config user.email "vok-bot@users.noreply.github.com"
          if [ "$DRIP" = "yes" ]; then
            python3 -m vok.run drip
          elif [ "$ALL" = "yes" ]; then
            python3 -m vok.run publish-all 180
          elif [ "${POST_ID#rephoto:}" != "$POST_ID" ]; then
            IFS='#' read -ra SPECS <<< "${POST_ID#rephoto:}"
            python3 -m vok.run rephoto "${SPECS[@]}"
          elif [ "${POST_ID#phototest:}" != "$POST_ID" ]; then
            python3 -c "import sys; from vok import images; r=images.pixabay(sys.argv[1]); print('pixabay results:', len(r)); [print(' ', c['credit'], c['page']) for c in r[:5]]" "${POST_ID#phototest:}"
          elif [ "$POST_ID" = "probe" ]; then
            python3 tools/probe.py
          elif [ "$POST_ID" = "report" ]; then
            python3 -m vok.report 24
          elif [ "$POST_ID" = "tokencheck" ]; then
            python3 -m vok.run tokencheck x
          elif [ "${POST_ID#quotes:}" != "$POST_ID" ]; then
            python3 -m vok.make_quotes "${POST_ID#quotes:}"
          elif [ "${POST_ID#igsource:}" != "$POST_ID" ]; then
            python3 -m vok.run igsource "${POST_ID#igsource:}"
          elif [ "${POST_ID#check:}" != "$POST_ID" ]; then
            python3 -m vok.run check "${POST_ID#check:}"
          elif [ "${POST_ID#repost:}" != "$POST_ID" ]; then
            python3 -m vok.run repost "${POST_ID#repost:}"
          elif [ -n "$POST_ID" ]; then
            python3 -m vok.run publish "$POST_ID"
          else
            python3 -m vok.tick
          fi

      - name: Save changes
        if: always()
        run: |
          git config user.name "vok-bot"
          git config user.email "vok-bot@users.noreply.github.com"
          git add posts data
          git diff --cached --quiet && exit 0
          git commit -m "tick: update posts [skip ci]"
          git pull --rebase -X theirs
          git push
