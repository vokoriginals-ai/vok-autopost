name: Make new posts

# Find trending Middle East / world stories, write them with Gemini, design
# them, and email each one for approval (GitHub issue; reply ok / no).
on:
  schedule:
    - cron: "20 7-23 * * *"     # every hour, PKT 12:20 pm to 4:20 am
    - cron: "20 0-4 * * *"      # PKT 5:20 am to 9:20 am
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to make (empty = normal)"
        required: false
        default: ""
      auto_approve:
        description: "yes = approve now (no email) · hold = park for review · no = email me"
        required: false
        default: "no"

permissions:
  contents: write
  issues: write

concurrency:
  group: vok-repo
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make posts
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          COUNT: ${{ github.event.inputs.count }}
          AUTO_APPROVE: ${{ github.event.inputs.auto_approve }}
        run: |
          ARGS=""
          [ -n "$COUNT" ] && ARGS="$ARGS --count $COUNT"
          [ "$AUTO_APPROVE" = "yes" ] && ARGS="$ARGS --approve"
          [ "$AUTO_APPROVE" = "hold" ] && ARGS="$ARGS --hold"
          python -m vok.make_posts $ARGS

      - name: Save new posts
        if: always()
        run: |
          git config user.name "vok-bot"
          git config user.email "vok-bot@users.noreply.github.com"
          git add posts data
          git diff --cached --quiet && exit 0
          git commit -m "New posts for approval [skip ci]"
          git pull --rebase -X theirs
          git push
